name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          # Some training tests read seeds via `git show <old rev>:...`.
          fetch-depth: 0
      # Pinned so a new clippy release can't turn main red on its own.
      # Bump deliberately, together with any new lint fixes.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --no-fail-fast

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff format --check .
      - run: ruff check .
      - run: python -m unittest discover -s deploy -p 'test_*.py'
      - run: python -m unittest discover -s benchmarks/randomized_search -p 'test_*.py'
      - run: python -m unittest discover -s training/tactical_tree -p 'test_*.py'

  nnue-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/nnue/requirements.txt
      - run: pip install -r training/nnue/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s training/nnue -p 'test_*.py'
