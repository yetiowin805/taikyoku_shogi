[package]
name = "taikyoku_shogi"
version = "0.1.0"
edition = "2021"
default-run = "taikyoku_shogi"

[[bin]]
name = "taikyoku_shogi"
path = "src/main.rs"

[dependencies]
libc = "0.2"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
ctrlc = { version = "3", features = ["termination"] }

[features]
search-profile = []
royal-probes = []
nnue-speed-probes = []

[profile.release]
lto = "thin"
codegen-units = 1


[[example]]
name = "royal_probe_smoke"
required-features = ["royal-probes"]

[[example]]
name = "nnue_speed_probe"
