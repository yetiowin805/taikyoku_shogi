[package]
name = "taikyoku_shogi"
version = "0.1.0"
edition = "2021"
default-run = "taikyoku_shogi"

[[bin]]
name = "taikyoku_shogi"
path = "src/main.rs"

[dependencies]
libc = "0.2"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
ctrlc = { version = "3", features = ["termination"] }

[features]
search-profile = []
royal-probes = []

[profile.release]
lto = "thin"
codegen-units = 1

# Fast production-like builds for the local web GUI. Keep `release` tuned for
# tournaments and benchmarks; this profile favors short incremental links.
[profile.gui]
inherits = "release"
lto = false
codegen-units = 16
incremental = true


[[example]]
name = "royal_probe_smoke"
required-features = ["royal-probes"]

# CI runs `cargo clippy --all-targets -- -D warnings`. Defaults stay on except
# lints that fight how engine code is written (index loops over board arrays,
# wide search/eval entry points).
[lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
new_without_default = "allow"
type_complexity = "allow"
assertions_on_constants = "allow"  # `assert!(!cfg!(debug_assertions))` guards perf tests
dbg_macro = "warn"
todo = "warn"
